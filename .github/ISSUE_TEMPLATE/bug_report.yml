name: Bug report
description: A notebook shows wrongly, or the reader misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: notebook
    attributes:
      label: Notebook
      description: Attach the .ipynb, or the smallest one that shows the problem. Check it holds nothing private first.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 26, macOS 26
    validations:
      required: true
